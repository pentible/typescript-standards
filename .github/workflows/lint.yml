name: lint
on: push
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - env:
          COLOR: 1
          FORCE_COLOR: 1
        run: |
          mise run \
          --continue-on-error \
          --output keep-order \
          lint
