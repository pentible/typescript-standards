[settings]
status.missing_tools = "always"

[env]
_.file = [".env"]
_.path = ["./node_modules/.bin", "./bin"]

[tools]
node = "24.18.0"
shellcheck = "0.10.0"
yamllint = "1.35.1"
pnpm = "11.17.0"

[tasks.lint]
depends = [
    "eslint",
    "prettier",
    "check-package-lock",
    "shellcheck",
    "yamllint",
    "tsc",
]
[tasks.prettier]
run = "prettier --check --log-level warn ."
[tasks.eslint]
run = "eslint --concurrency auto"
[tasks.check-package-lock]
run = "check-package-lock"
[tasks.shellcheck]
run = "shellcheck-all"
[tasks.yamllint]
run = "yamllint --strict ."
[tasks.tsc]
run = "tsc -b"

[tasks.'lint:fix']
depends = ["prettier:fix", "eslint:fix"]
[tasks.'prettier:fix']
run = "prettier --write --log-level warn ."
wait_for = ["eslint:fix"]
[tasks.'eslint:fix']
run = "eslint --concurrency auto --fix"
